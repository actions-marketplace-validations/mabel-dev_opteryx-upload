name: publish

on:
  push:
    tags:
      # A full version and not `v*`, because the action in this repository is
      # consumed as `@v1` - a moving major tag. That tag matching this workflow
      # would mean every action release trying to publish a version PyPI
      # already has, and failing.
      - 'v*.*.*'

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: deps
      run: python -m pip install -U build

    - name: build
      run: python -m build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
